name: Refresh profile cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build.py, scripts/github_stats.py, scripts/svg_cards.py, scripts/data.json]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PROFILE_TOKEN is a read-only PAT so the cards recompute daily. Without it the
      # build keeps the cached data.json instead of failing.
      - run: python scripts/build.py
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets scripts/data.json
          git diff --cached --quiet || (git commit -m "Refresh profile cards" && git push)
